name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install Python packages
        run: pip install pytest ruff Jinja2 PySide6
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
