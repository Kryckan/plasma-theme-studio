[project]
name = "plasma-theme-studio"
version = "0.1.0"
description = "Edit every part of a KDE Plasma theme in one place"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# PySide6 is deliberately not listed: the app must use the distribution's
# PySide6 so that it loads the real KDE widget styles.
dependencies = ["Jinja2>=3.0"]
keywords = ["kde", "plasma", "theme", "colors", "appearance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
]

[project.urls]
Homepage = "https://github.com/Kryckan/plasma-theme-studio"
Issues = "https://github.com/Kryckan/plasma-theme-studio/issues"
Source = "https://github.com/Kryckan/plasma-theme-studio"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]
